services:
  vault:
    image: hashicorp/vault:latest
    container_name: transcendence-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    command: "server -dev"
    networks:
      - transcendence_net
  db:
    image: postgres:16-alpine
    container_name: transcendence-db
    restart: unless-stopped #Comportement apres un crash ou reboot (sa redemarre automatiquement)
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - transcendence_net # Le container rjoint un reseau docker personaliser permetant aux autres containers de communiquer avec lui
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - transcendence_net

  backend:
    extra_hosts:
      - "host.docker.internal:host-gateway" # dev ganache local blockcahn
    build:
      context: ./backend
    container_name: transcendence-backend
    restart: unless-stopped
    env_file: 
      - .env
    environment:
        DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
        DJANGO_DEBUG: ${DJANGO_DEBUG}
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_HOST: db
        POSTGRES_PORT: 5432 #Port standart PostgreSQL
    volumes:
      - ./backend:/app
      - media_data:/app/media
      - ./docker/backups:/backups
      - ./vault_backend_token.txt:/run/secrets/vault_token:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000" #expose le port du conteneur vers la machine locale HOST:CONTAINER
    networks:
      - transcendence_net

  frontend:
    build:
      context: ./frontend
    container_name: transcendence-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - backend
    # ports: 
    #   - "3000:3000"
    networks:
      - transcendence_net

  prometheus:
    image: prom/prometheus:latest
    container_name: transcendence-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - transcendence_net

  grafana:
    image: grafana/grafana:latest
    container_name: transcendence-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - transcendence_net

volumes:
  postgres_data:
  media_data:
  frontend_node_modules:
  frontend_next_cache:
  grafana_data:

networks:
  transcendence_net:
    driver: bridge